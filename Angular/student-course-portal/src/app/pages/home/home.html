<h1>Welcome to Student Course Portal</h1>
<p>Track your courses, grades, and enrollment all in one place.</p>

<div class="stats-row">
  <span>Courses Available: 12</span>
  <span>Enrolled: 3</span>
  <span>GPA: 3.8</span>
</div>

<h1>{{ portalName }}</h1>

<button [disabled]="!isPortalActive" (click)="onEnrollClick()">
  Enroll Now
</button>

<p>{{ message }}</p>

<input [(ngModel)]="searchTerm" placeholder="Search courses">

<p>Searching for: {{ searchTerm }}</p>
